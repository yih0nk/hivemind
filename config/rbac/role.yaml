---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - get
  - list
  - patch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - incidents.yih0nk.github.io
  resources:
  - incidenttriages
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - incidents.yih0nk.github.io
  resources:
  - incidenttriages/finalizers
  verbs:
  - update
- apiGroups:
  - incidents.yih0nk.github.io
  resources:
  - incidenttriages/status
  verbs:
  - get
  - patch
  - update
