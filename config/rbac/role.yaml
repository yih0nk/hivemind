---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - incidents.yihanhong.dev
  resources:
  - incidenttriages
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - incidents.yihanhong.dev
  resources:
  - incidenttriages/finalizers
  verbs:
  - update
- apiGroups:
  - incidents.yihanhong.dev
  resources:
  - incidenttriages/status
  verbs:
  - get
  - patch
  - update
