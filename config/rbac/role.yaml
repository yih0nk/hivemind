---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - events
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - incidents.yihanhong.dev
  resources:
  - incidenttriages
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - incidents.yihanhong.dev
  resources:
  - incidenttriages/status
  verbs:
  - get
  - patch
  - update
