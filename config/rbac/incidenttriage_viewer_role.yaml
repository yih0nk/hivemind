# This rule is not used by the project hivemind itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to incidents.yih0nk.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/managed-by: kustomize
  name: incidenttriage-viewer-role
rules:
- apiGroups:
  - incidents.yih0nk.github.io
  resources:
  - incidenttriages
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - incidents.yih0nk.github.io
  resources:
  - incidenttriages/status
  verbs:
  - get
