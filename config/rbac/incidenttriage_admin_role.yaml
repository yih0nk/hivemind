# This rule is not used by the project hivemind itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over incidents.yih0nk.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/managed-by: kustomize
  name: incidenttriage-admin-role
rules:
- apiGroups:
  - incidents.yih0nk.github.io
  resources:
  - incidenttriages
  verbs:
  - '*'
- apiGroups:
  - incidents.yih0nk.github.io
  resources:
  - incidenttriages/status
  verbs:
  - get
