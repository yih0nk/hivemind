# A deployment that crashloops immediately, for exercising the operator
# end to end. The container prints one OOM-looking error line and exits,
# giving the log-triage agent a real signal to find.
apiVersion: v1
kind: Namespace
metadata:
  name: hivemind-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-crashloop
  namespace: hivemind-test
  labels:
    app: chaos-crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-crashloop
  template:
    metadata:
      labels:
        app: chaos-crashloop
    spec:
      containers:
        - name: crashloop
          image: busybox:1.36
          command: ["sh", "-c", "echo 'OOM error: killed'; exit 1"]
