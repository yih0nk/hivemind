[project]
name = "hivemind-brain"
version = "0.1.0"
description = "LangGraph reasoning service for Hivemind incident triage"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hivemind_brain"]
