name: Brain Tests

on:
  push:
    paths:
      - "brain/**"
      - ".github/workflows/brain-tests.yml"
  pull_request:
    paths:
      - "brain/**"
      - ".github/workflows/brain-tests.yml"

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: pytest (brain)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Mock provider: deterministic and offline, no GROQ_API_KEY needed.
        env:
          HIVEMIND_LLM_PROVIDER: mock
        run: python -m pytest
