{{- if or .Values.githubToken .Values.llmApiKey .Values.brain.postgres.dsn }}
apiVersion: v1
kind: Secret
metadata:
  name: hivemind-secrets
  namespace: {{ .Values.operatorNamespace }}
  labels:
    app.kubernetes.io/name: hivemind
type: Opaque
stringData:
  {{- if .Values.githubToken }}
  GITHUB_TOKEN: {{ .Values.githubToken | quote }}
  {{- end }}
  {{- if .Values.llmApiKey }}
  HIVEMIND_LLM_API_KEY: {{ .Values.llmApiKey | quote }}
  # Same key, under the name the brain expects (GROQ_API_KEY).
  GROQ_API_KEY: {{ .Values.llmApiKey | quote }}
  {{- end }}
  {{- if .Values.brain.postgres.dsn }}
  HIVEMIND_PG_DSN: {{ .Values.brain.postgres.dsn | quote }}
  {{- end }}
{{- end }}
