apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivemind
  namespace: {{ .Values.operatorNamespace }}
  labels:
    app.kubernetes.io/name: hivemind
spec:
  # Single replica: the manager runs without leader election.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hivemind
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hivemind
    spec:
      serviceAccountName: hivemind
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: HIVEMIND_OLLAMA_URL
              value: {{ .Values.ollamaURL | quote }}
            - name: HIVEMIND_OLLAMA_MODEL
              value: {{ .Values.ollamaModel | quote }}
            - name: HIVEMIND_PROMETHEUS_URL
              value: {{ .Values.prometheusURL | quote }}
            - name: HIVEMIND_AGENT_TIMEOUT_SECONDS
              value: {{ .Values.agentTimeoutSeconds | quote }}
            {{- if .Values.brain.enabled }}
            # Delegate synthesis to the in-cluster LangGraph brain. Evidence
            # collection stays here; only the reasoning is sent over. The brain's
            # reflection loop makes several LLM calls, so agentTimeoutSeconds
            # bounds it -- keep that generous when the brain is enabled.
            - name: HIVEMIND_REASONER_URL
              value: "http://hivemind-brain.{{ .Values.operatorNamespace }}:{{ .Values.brain.port }}"
            {{- end }}
            - name: HIVEMIND_WEBHOOK_PORT
              value: {{ .Values.webhookPort | quote }}
            - name: HIVEMIND_GITHUB_REPO
              value: {{ .Values.githubRepo | quote }}
            - name: HIVEMIND_REQUIRE_APPROVAL
              value: {{ .Values.requireApproval | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.githubToken }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hivemind-secrets
                  key: GITHUB_TOKEN
            {{- end }}
            {{- if .Values.llmApiKey }}
            - name: HIVEMIND_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hivemind-secrets
                  key: HIVEMIND_LLM_API_KEY
            {{- end }}
          ports:
            - name: webhook
              containerPort: {{ .Values.webhookPort }}
            # controller-runtime health probes (--health-probe-bind-address).
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
