# Mirrors config/rbac/role.yaml (generated from the kubebuilder markers);
# update both together when a marker changes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hivemind
  labels:
    app.kubernetes.io/name: hivemind
rules:
  - apiGroups: [incidents.yih0nk.github.io]
    resources: [incidenttriages]
    verbs: [create, get, list, watch, update, patch]
  - apiGroups: [incidents.yih0nk.github.io]
    resources: [incidenttriages/status]
    verbs: [get, update, patch]
  - apiGroups: [incidents.yih0nk.github.io]
    resources: [incidenttriages/finalizers]
    verbs: [update]
  - apiGroups: [""]
    resources: [pods, configmaps]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hivemind
  labels:
    app.kubernetes.io/name: hivemind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hivemind
subjects:
  - kind: ServiceAccount
    name: hivemind
    namespace: {{ .Values.operatorNamespace }}
